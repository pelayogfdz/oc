
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  body {
    width: 1920px; height: 1080px;
    background: radial-gradient(circle at 50% 40%, #1e1b4b 0%, #0f172a 70%, #020617 100%);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    color: white; position: relative; overflow: hidden;
  }
  .glow {
    position: absolute; width: 900px; height: 900px;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, rgba(0,0,0,0) 70%);
    top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none;
  }
  .card {
    background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 32px;
    padding: 64px 80px; max-width: 1400px; text-align: center;
    box-shadow: 0 35px 60px -15px rgba(0, 0, 0, 0.5); z-index: 10;
    display: flex; flex-direction: column; align-items: center;
  }
  .logo-box {
    width: 80px; height: 80px;
    background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
    border-radius: 24px; display: flex; align-items: center; justify-content: center;
    font-size: 44px; font-weight: 900; margin-bottom: 24px;
    box-shadow: 0 15px 30px rgba(139, 92, 246, 0.4);
  }
  .title {
    font-size: 50px; font-weight: 800; margin-bottom: 16px;
    background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .subtitle { font-size: 24px; color: #a78bfa; margin-bottom: 36px; font-weight: 600; }
  .features { display: flex; gap: 32px; margin-bottom: 36px; }
  .feature-item {
    background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 16px 28px; border-radius: 16px; font-size: 18px; color: #cbd5e1;
    display: flex; align-items: center; gap: 12px;
  }
  .check { color: #10b981; font-weight: bold; }
  .cta-button {
    background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
    color: white; padding: 18px 48px; border-radius: 18px; font-size: 22px;
    font-weight: 700; box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4);
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="card">
    <div class="logo-box">C</div>
    <div class="title">¡Gracias por capacitarte con CAANMA ERP!</div>
    <div class="subtitle">El sistema más intuitivo para la gestión corporativa en México</div>
    <div class="features">
      <div class="feature-item"><span class="check">✓</span> Punto de Venta POS</div>
      <div class="feature-item"><span class="check">✓</span> Inventarios Multi-sucursal</div>
      <div class="feature-item"><span class="check">✓</span> Timbrado CFDI 4.0 SAT</div>
    </div>
    <div class="cta-button">www.caanma.com • Centro de Capacitación</div>
  </div>
</body>
</html>
