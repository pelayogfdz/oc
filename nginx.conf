user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # HTTP - Redirect all traffic to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name caanma.com www.caanma.com;

        # Certbot webroot validation path
        location /.well-known/acme-challenge/ {
            root /var/lib/letsencrypt/;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS - Secure Web App Server
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name caanma.com www.caanma.com;

        # Let's Encrypt SSL Certificates (mounted)
        ssl_certificate /etc/letsencrypt/live/caanma.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/caanma.com/privkey.pem;

        # SSL Session settings
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # HSTS (uncomment once DNS is validated)
        # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Disable uncommon HTTP request methods (security)
        if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|PATCH)$ ) {
            return 444;
        }

        # Block access to hidden files and folders (.git, .env)
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Reverse Proxy for Next.js app
        location / {
            limit_req zone=api_limit burst=30 nodelay; # Rate limiting on main app
            proxy_pass http://nextjs-app:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 50M;
        }

        # Route for WhatsApp service endpoints (internal API / debugging)
        location /api/whatsapp-worker/ {
            limit_req zone=api_limit burst=5 nodelay;
            rewrite ^/api/whatsapp-worker/(.*) /$1 break;
            proxy_pass http://whatsapp-worker:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
